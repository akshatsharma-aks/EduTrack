<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trainee Dashboard | EduTrack</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="dashboard-page">

    <header class="dashboard-header">

        <div class="brand">

            <div class="brand-icon">
                E
            </div>

            <span>EduTrack</span>

        </div>

        <button
                class="btn secondary"
                onclick="logout()">

            Logout

        </button>

    </header>

    <main class="dashboard-content">

        <p class="eyebrow">
            TRAINEE PORTAL
        </p>

        <h1>
            Welcome, <span id="userName"></span>
        </h1>

        <div class="dashboard-card">

            <p class="card-label">
                Current Role
            </p>

            <h2 id="userRole">
                TRAINEE
            </h2>

            <p>
                You have trainee access to EduTrack.
            </p>

        </div>

    </main>

</div>

<script src="/js/dashboard.js"></script>

</body>

</html>

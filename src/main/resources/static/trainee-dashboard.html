<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trainee Dashboard | EduTrack</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="dashboard-page">

    <header class="dashboard-header">

        <div class="brand">

            <div class="brand-icon">
                E
            </div>

            <span>EduTrack</span>

        </div>

        <button
                class="btn secondary"
                onclick="logout()">

            Logout

        </button>

    </header>

    <main class="admin-content">

        <p class="eyebrow">
            TRAINEE PORTAL
        </p>

        <h1>
            Welcome,
            <span id="userName"></span>
        </h1>

        <p class="admin-subtitle">
            Find training batches and manage your enrollment.
        </p>

        <!-- AVAILABLE BATCHES -->

        <section class="admin-section">

            <div class="section-heading">

                <div>

                    <h2>
                        Available Batches
                    </h2>

                    <p>
                        Request access to a training batch.
                    </p>

                </div>

            </div>

            <div id="availableBatches"
                 class="data-list">

            </div>

        </section>

        <!-- MY ENROLLMENTS -->

        <section class="admin-section">

            <div class="section-heading">

                <div>

                    <h2>
                        My Enrollment Requests
                    </h2>

                    <p>
                        Track your enrollment status.
                    </p>

                </div>

            </div>

            <div id="myEnrollments"
                 class="data-list">

            </div>

        </section>

        <!-- MY APPROVED BATCHES -->

        <section class="admin-section">

            <div class="section-heading">

                <div>

                    <h2>
                        My Batches
                    </h2>

                    <p>
                        Batches you have been approved to access.
                    </p>

                </div>

            </div>

            <div id="myBatches"
                 class="data-list">

            </div>

        </section>

    </main>

</div>

<script src="/js/trainee-dashboard.js"></script>

</body>

</html>

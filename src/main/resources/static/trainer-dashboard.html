<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trainer Dashboard | EduTrack</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="dashboard-page">

    <header class="dashboard-header">

        <div class="brand">

            <div class="brand-icon">
                E
            </div>

            <span>EduTrack</span>

        </div>

        <button
                class="btn secondary"
                onclick="logout()">

            Logout

        </button>

    </header>

    <main class="admin-content">

        <p class="eyebrow">
            TRAINER PORTAL
        </p>

        <h1>
            Welcome, <span id="userName"></span>
        </h1>

        <p class="admin-subtitle">
            Your assigned training batches.
        </p>

        <section class="admin-section">

            <h2>
                Assigned Batches
            </h2>

            <div id="trainerBatches"
                 class="data-list">

            </div>

        </section>
        <section class="admin-section">

            <div class="section-heading">

                <div>

                    <h2>
                        Enrollment Requests
                    </h2>

                    <p>
                        Review trainees requesting access to your batches.
                    </p>

                </div>

            </div>

            <div id="enrollmentRequests"
                 class="data-list">

            </div>

        </section>

    </main>

</div>

<script src="/js/trainer-dashboard.js"></script>

</body>

</html>
